{{- if and .Values.route.enabled .Values.service.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    # The label allows kdp-llm-controller-manager (running within the KubeLB management cluster)
    # to efficiently discover the route that exposes the Service an LLMBackend references.
    ai.kdp.k8c.io/ai-service: {{ .Release.Name }}
    {{- include "watsonx-openai-shim.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ tpl .Values.route.gateway.namespace . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      filters:
        # Strip the path prefix from the request before passing it down to the backing LLM Service.
        # Though, as long as llm-cm is not wiring up the attached Gateway but the backing Service
        # to the AgentgatewayBackend directly (to save a hop), this isn't actually effective.
        # (It is still defined here to keep the door open for wiring up the Gateway later.)
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
{{- end }}
