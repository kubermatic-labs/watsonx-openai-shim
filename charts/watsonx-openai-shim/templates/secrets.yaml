{{/*
One Opaque Secret per entry in .Values.extraSecrets, keyed by Secret
name. Values are written to stringData verbatim, so they are given in plain text.
The Secret name is run through `tpl`, so it may reference the release, e.g.
"{{ .Release.Name }}-zen-apikey". Values are not templated - a credential that
happens to contain Go template delimiters stays intact.
*/}}
{{- range $name, $data := .Values.extraSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl $name $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "watsonx-openai-shim.labels" $ | nindent 4 }}
type: Opaque
{{- with $data }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
