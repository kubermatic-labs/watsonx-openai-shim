{{- if include "watsonx-openai-shim.credentialsInline" . }}
{{- $creds := .Values.watsonx.credentials }}
# Created because watsonx.credentials.username and .apiKey are set inline. The
# data keys follow usernameKey/apiKeyKey so the Deployment's secretKeyRefs match
# whether the Secret comes from here or already existed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "watsonx-openai-shim.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watsonx-openai-shim.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $creds.usernameKey }}: {{ $creds.username | toString | quote }}
  {{ $creds.apiKeyKey }}: {{ $creds.apiKey | toString | quote }}
{{- end }}
