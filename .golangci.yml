version: "2"
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - rowserrcheck
    - gosec
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - /_build$
      - /vendor$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - /_build$
      - /vendor$
